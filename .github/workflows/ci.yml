name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job A: every apt package the catalog needs exists in Debian 13, the dry run works, shellcheck passes.
  package-check:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm shellcheck ca-certificates git

      - name: Refuse secret-looking files
        run: node scripts/check-secrets.mjs

      - name: Build the site and installer
        run: |
          npm ci
          npm run build

      - name: apt-cache policy for every catalog package (fails on any missing candidate)
        run: |
          apt-get update
          status=0
          for pkg in $(node scripts/ci-helpers.mjs packages); do
            candidate="$(apt-cache policy "$pkg" | awk '/Candidate:/ {print $2; exit}')"
            if [ -z "$candidate" ] || [ "$candidate" = "(none)" ]; then
              echo "MISSING: $pkg has no candidate in Debian 13"
              status=1
            else
              echo "ok: $pkg $candidate"
            fi
          done
          exit "$status"

      - name: Packaged versions in Debian 13 (fails if any candidate is missing)
        run: |
          status=0
          {
            echo "## Packaged versions (debian:trixie)"
            echo
            echo "| package | candidate version |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in sway waybar fuzzel foot mako-notifier swaybg; do
            candidate="$(apt-cache policy "$pkg" | awk '/Candidate:/ {print $2; exit}')"
            if [ -z "$candidate" ] || [ "$candidate" = "(none)" ]; then
              echo "| $pkg | MISSING |" >> "$GITHUB_STEP_SUMMARY"
              echo "MISSING: $pkg has no candidate in Debian 13"
              status=1
            else
              echo "| $pkg | $candidate |" >> "$GITHUB_STEP_SUMMARY"
              echo "version: $pkg $candidate"
            fi
          done
          exit "$status"

      - name: Dry run of the generated installer (as a normal user; the installer refuses root)
        run: |
          useradd -m builder
          cp -r . /tmp/deskwizard
          chown -R builder /tmp/deskwizard
          runuser -u builder -- bash /tmp/deskwizard/site/public/v1/install.sh --dry-run

      - name: shellcheck -x on the generated installer and the smoke scripts
        run: |
          shellcheck -x site/public/v1/install.sh
          shellcheck -x scripts/smoke-tools.sh

  # Job B: every variant of waybar, foot, fuzzel, mako and swaybg starts under headless Sway,
  # stays up for 5 s, and is screenshotted. The files are the ones the installer writes.
  tool-smoke:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install Node and build the catalog
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates
          npm ci
          npm run -s render-wallpapers
          node scripts/validate.mjs
          node scripts/build-catalog.mjs

      - name: Install Sway and every catalog tool package (from the catalog, not a fixed list)
        run: |
          apt-get install -y --no-install-recommends sway xwayland grim procps curl xz-utils \
            fontconfig dbus-daemon dbus-user-session $(node scripts/ci-helpers.mjs packages)
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Install the pinned default Nerd Font (checksum must match)
        run: |
          eval "$(node scripts/ci-helpers.mjs font)"
          url="https://github.com/ryanoasis/nerd-fonts/releases/download/${NERD_FONT_VERSION}/${NERD_FONT_ARCHIVE}"
          curl -fsSL -o "/tmp/${NERD_FONT_ARCHIVE}" "$url"
          echo "${NERD_FONT_SHA256}  /tmp/${NERD_FONT_ARCHIVE}" | sha256sum -c -
          dest="/home/builder/.local/share/fonts/NerdFonts/${NERD_FONT_DEST}"
          runuser -u builder -- mkdir -p "$dest"
          runuser -u builder -- tar -xJf "/tmp/${NERD_FONT_ARCHIVE}" -C "$dest"
          fc-cache -f /home/builder/.local/share/fonts

      - name: Smoke test every variant of the five tools on headless Sway
        run: |
          # Tools need a session D-Bus; dbus-run-session provides one for sway and the tools.
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" \
            dbus-run-session -- bash -c "cd '$GITHUB_WORKSPACE' && OUT='$GITHUB_WORKSPACE/smoke-out' bash scripts/smoke-tools.sh"

      - name: Add the smoke summary to the job summary
        if: always()
        run: |
          if [ -f smoke-out/summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat smoke-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-smoke
          path: smoke-out/
          if-no-files-found: warn

  # Job C: click through the wizard in headless Chromium and save a screenshot per step.
  wizard-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the site
        run: |
          npm ci
          npm run build

      - name: Install Playwright (CI only, not a repo dependency) and Chromium
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Run the wizard click-through
        run: node tests/e2e/wizard.e2e.mjs

      - name: Upload step screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-e2e-screenshots
          path: e2e-shots/
          if-no-files-found: warn
