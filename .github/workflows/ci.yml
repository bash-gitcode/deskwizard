name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job A: every apt package the catalog needs exists in Debian 13, the dry run works, shellcheck passes.
  package-check:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm shellcheck ca-certificates git

      - name: Refuse secret-looking files
        run: node scripts/check-secrets.mjs

      - name: Build the site and installer
        run: |
          npm ci
          npm run build

      - name: Every catalog file is referenced by a tool or variant (fails on orphans)
        run: npm run -s check-catalog-refs

      - name: Built manifest and installer match the files on disk (fails if out of date)
        run: npm run -s check-manifest

      - name: apt-cache policy for every catalog package (fails on any missing candidate)
        run: |
          apt-get update
          status=0
          for pkg in $(node scripts/ci-helpers.mjs packages); do
            candidate="$(apt-cache policy "$pkg" | awk '/Candidate:/ {print $2; exit}')"
            if [ -z "$candidate" ] || [ "$candidate" = "(none)" ]; then
              echo "MISSING: $pkg has no candidate in Debian 13"
              status=1
            else
              echo "ok: $pkg $candidate"
            fi
          done
          exit "$status"

      - name: Packaged versions in Debian 13 (fails if any candidate is missing)
        run: |
          status=0
          {
            echo "## Packaged versions (debian:trixie)"
            echo
            echo "| package | candidate version |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in sway waybar fuzzel foot mako-notifier swaybg greetd tuigreet; do
            candidate="$(apt-cache policy "$pkg" | awk '/Candidate:/ {print $2; exit}')"
            if [ -z "$candidate" ] || [ "$candidate" = "(none)" ]; then
              echo "| $pkg | MISSING |" >> "$GITHUB_STEP_SUMMARY"
              echo "MISSING: $pkg has no candidate in Debian 13"
              status=1
            else
              echo "| $pkg | $candidate |" >> "$GITHUB_STEP_SUMMARY"
              echo "version: $pkg $candidate"
            fi
          done
          exit "$status"

      - name: shellcheck -x on the installer, the uninstaller and the smoke scripts
        run: |
          shellcheck -x site/public/v1/install.sh
          shellcheck -x site/public/v1/uninstall.sh
          shellcheck -x scripts/smoke-tools.sh
          shellcheck -x scripts/smoke-repeat.sh

  # First-run check for contributors: a fresh clone of this commit, then the three commands from the README.
  # Runs in its own container, so nothing from the build workspace leaks into it.
  first-run:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install node, git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates git

      - name: Clone this commit (committed files only, like a contributor's clone)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone "$GITHUB_WORKSPACE" /tmp/fresh
          cd /tmp/fresh && git log -1 --oneline

      - name: npm ci
        run: cd /tmp/fresh && npm ci

      - name: npm run validate
        run: cd /tmp/fresh && npm run validate

  # Job H4: the installer's dry run for the default build, in debian:trixie. The full output goes to
  # the job summary. The test base URL is a file:// copy of the build, so the dry run uses this commit.
  dry-run:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node and build the site and installer
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates curl xz-utils
          npm ci
          npm run build

      - name: Dry run of the default build (as a normal user; the installer refuses root)
        run: |
          set -o pipefail
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          CODE="$(node scripts/ci-helpers.mjs code manual)"
          runuser -u builder -- env HOME=/home/builder DESKWIZARD_TEST_MODE=1 \
            DESKWIZARD_TEST_BASE_URL="file://$GITHUB_WORKSPACE/site/public/v1" \
            bash "$GITHUB_WORKSPACE/site/public/v1/install.sh" --build "$CODE" --dry-run 2>&1 | tee dry-run.log

      - name: Unit and installer tests (as builder; includes the tamper, unknown-id, malformed and oversized cases)
        run: |
          runuser -u builder -- env HOME=/home/builder node --test tests/generator.test.mjs tests/installer.test.mjs

      - name: Put the full dry-run output in the job summary
        if: always()
        run: |
          {
            echo "## Installer dry run (debian:trixie, default build, full output)"
            echo
            echo '```text'
            cat dry-run.log 2>/dev/null || echo "(no output: the dry run did not start)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Job B: every variant of waybar, foot, fuzzel, mako and swaybg runs under headless Sway (see smoke.yml).
  tool-smoke:
    uses: ./.github/workflows/smoke.yml

  # On pull requests, the e2e job runs only when site/ or catalog/ changed. Pushes to main always run it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(site|catalog)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No site/ or catalog/ changes; skipping the wizard e2e."
          fi

  # Job D: the real installer on debian:trixie, then headless Sway on the installed config, with a screenshot.
  full-install:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node and build the site and installer
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates curl xz-utils
          npm ci
          npm run build

      - name: Create a normal user with passwordless sudo (the installer refuses root and uses sudo for apt)
        run: |
          apt-get install -y --no-install-recommends sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Install and check the desktop, then screenshot it
        run: |
          # The check needs grim and notify-send in the container; the installer installs the rest.
          apt-get install -y --no-install-recommends sway xwayland grim libnotify-bin procps dbus-daemon dbus-user-session
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" \
            dbus-run-session -- bash -c "cd '$GITHUB_WORKSPACE' && OUT='$GITHUB_WORKSPACE/full-install-out' bash scripts/full-install-check.sh"

      - name: Add the check summary to the job summary
        if: always()
        run: |
          if [ -f full-install-out/summary.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat full-install-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the screenshot and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-install
          path: full-install-out/
          if-no-files-found: warn

  # Job U: install the tty1 and greetd builds over seeded files, run uninstall.sh as a normal user with
  # passwordless sudo, and assert the profile block, the home backups and the /etc/greetd restore.
  uninstall:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node, sudo and the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates curl xz-utils sudo
          npm ci
          npm run build

      - name: Normal user with passwordless sudo; systemctl shim (CI only, no systemd here)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          printf '%s\n' '#!/bin/sh' 'exit 0' > /usr/local/bin/systemctl
          chmod 755 /usr/local/bin/systemctl
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Conffile check (existing greetd config.toml, stdin closed, timeout)
        run: |
          chmod +x scripts/conffile-check.sh
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" bash scripts/conffile-check.sh

      - name: Install, uninstall, assert
        run: |
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" bash scripts/uninstall-check.sh

      - name: Add the check summary to the job summary
        if: always()
        run: |
          for s in conffile-out/summary.md uninstall-out/summary.md; do
            if [ -f "$s" ]; then cat "$s" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload the conffile logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conffile-logs
          path: conffile-out/
          if-no-files-found: warn

      - name: Upload the uninstall logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: uninstall-logs
          path: uninstall-out/
          if-no-files-found: warn

  # Job F: every pinned Nerd Font archive matches its catalog sha256, and the installer falls back
  # to fonts-font-awesome when the download fails.
  font-check:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node and build the site and installer
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates curl xz-utils
          npm ci
          npm run build

      - name: Check the pinned Nerd Font sha256 values (downloads from github.com)
        run: node scripts/check-fonts.mjs

      - name: Normal user for the font test (the installer refuses root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Test the font-awesome fallback when the download fails
        run: |
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" bash scripts/test-font-fallback.sh

  # Job G: each start method writes what it promises, in debian:trixie. Real login is not tested here:
  # systemd is not running in the container, so a test-only systemctl shim records the enable call.
  start-methods:
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        method: [tty1, greetd]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node, sudo and the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs npm ca-certificates curl xz-utils sudo python3
          npm ci
          npm run build

      - name: Normal user with passwordless sudo; systemctl shim (CI only, no systemd here)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          printf '%s\n' '#!/bin/sh' 'echo "$@" >> /tmp/systemctl-shim.log' 'exit 0' > /usr/local/bin/systemctl
          chmod 755 /usr/local/bin/systemctl
          chown -R builder "$GITHUB_WORKSPACE"

      - name: Run the installer with the ${{ matrix.method }} start method
        run: |
          CODE="$(node scripts/ci-helpers.mjs code ${{ matrix.method }})"
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" DESKWIZARD_TEST_MODE=1 \
            DESKWIZARD_TEST_BASE_URL="file://$GITHUB_WORKSPACE/site/public/v1" \
            bash "$GITHUB_WORKSPACE/site/public/v1/install.sh" --build "$CODE" 2>&1 | tee install.log

      - name: Upload the installer log when a start method fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-log-${{ matrix.method }}
          path: install.log
          if-no-files-found: warn

      - name: Assert what the start method wrote
        run: |
          set -eu
          if [ "${{ matrix.method }}" = tty1 ]; then
            grep -qx '# BEGIN deskwizard' /home/builder/.profile
            grep -qx '# END deskwizard' /home/builder/.profile
            grep -q 'exec sway' /home/builder/.profile
            echo "ok: marked tty1 block in ~/.profile"
          else
            python3 -c 'import sys, tomllib; c = tomllib.load(open("/etc/greetd/config.toml", "rb")); cmd = c["default_session"]["command"]; assert "tuigreet" in cmd, cmd; assert c["terminal"]["vt"] == 1; print("ok: /etc/greetd/config.toml parses; command:", cmd)'
            test -s /usr/share/wayland-sessions/sway.desktop || { echo 'missing sway session entry'; exit 1; }
            echo "ok: sway session entry exists"
            grep -q 'enable greetd.service' /tmp/systemctl-shim.log
            echo "ok: greetd.service enable requested"
          fi

  # Job C: click through the wizard in headless Chromium and save a screenshot per step.
  wizard-e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm

      - name: Build the site
        run: |
          npm ci
          npm run build

      - name: Install Playwright (CI only, not a repo dependency) and Chromium
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Run the wizard click-through
        run: node tests/e2e/wizard.e2e.mjs

      - name: Upload step screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wizard-e2e-screenshots
          path: e2e-shots/
          if-no-files-found: warn
