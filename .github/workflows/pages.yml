name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every catalog variant must start on headless Sway before the site is published.
  smoke:
    uses: ./.github/workflows/smoke.yml

  build:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download the smoke screenshots
        uses: actions/download-artifact@v4
        with:
          name: tool-smoke
          path: smoke-out
      # Wallpaper PNGs are gitignored; render them from the committed SVGs before the catalog reads them.
      - run: npm run -s render-wallpapers
      # The copy step reads the variant list from the catalog, so build it first.
      - run: npm run -s build-catalog
      # Fails if any variant's screenshot is missing.
      - run: node scripts/copy-screenshots.mjs smoke-out
      # Runs validate, build-catalog, generate-install (install.sh) and the Vite build.
      - run: npm run build
      - run: test -s dist/install.sh && test -s dist/catalog.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
