name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Every catalog variant must start on headless Sway before the site is published.
  smoke:
    uses: ./.github/workflows/smoke.yml

  build:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download the smoke screenshots
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tool-smoke
          path: smoke-out
      # Wallpaper PNGs are gitignored; render them from the committed SVGs before the catalog reads them.
      - run: npm run -s render-wallpapers
      # The copy step reads the variant list from the catalog, so build it first.
      - run: npm run -s build-catalog
      # Fails if any variant's screenshot is missing.
      - run: node scripts/copy-screenshots.mjs smoke-out
      # Runs validate, build-catalog, generate-install (install.sh) and the Vite build.
      - run: npm run build
      - run: test -s dist/install.sh && test -s dist/catalog.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
