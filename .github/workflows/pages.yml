name: Pages

on:
  push:
    branches: [main]
  # Pull requests run the same build (so a missing scene image or a broken build fails before merge), but the
  # deploy job below is main-only.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull requests get their own group, so a PR run never cancels a main deploy.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  # Every catalog variant must start on headless Sway before the site is published.
  smoke:
    uses: ./.github/workflows/smoke.yml

  # The scene images on the site (base scenes and tool crops), captured and cropped on headless Sway.
  scene-shots:
    uses: ./.github/workflows/screenshots.yml

  build:
    needs: [smoke, scene-shots]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download the scene images
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scene-shots
          path: scene-shots
      # Wallpaper PNGs are gitignored; render them from the committed SVGs before the catalog reads them.
      - run: npm run -s render-wallpapers
      # The copy step reads the variant list from the catalog, so build it first.
      - run: npm run -s build-catalog
      # Fails if any image the catalog references is missing or empty.
      - run: node scripts/copy-screenshots.mjs scene-shots
      # Runs validate, build-catalog, generate-install (install.sh) and the Vite build.
      - run: npm run build
      - run: test -s dist/install.sh && test -s dist/catalog.json
      # Every published release has an immutable snapshot at /<tag>/, stored as a release asset by release.yml.
      # Rebuilding the site from scratch would otherwise drop old snapshots, so they are restored here.
      # A missing asset fails the build, and an existing folder is never overwritten.
      - name: Restore release snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p snapshots
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease \
            -q '.[] | [.tagName, (.isPrerelease | tostring)] | @tsv' > releases.tsv
          latest=""
          while IFS=$'\t' read -r tag pre; do
            [ -n "$tag" ] || continue
            if [ -e "dist/$tag" ]; then echo "refusing to overwrite dist/$tag"; exit 1; fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "snapshot-$tag.tar.gz" --dir snapshots
            tar -xzf "snapshots/snapshot-$tag.tar.gz" -C dist
            test -s "dist/$tag/install.sh"
            echo "restored /$tag/"
            if [ "$pre" = "false" ] && [ -z "$latest" ]; then latest="$tag"; fi
          done < releases.tsv
          # The wizard's Review page points at the latest stable tag, or at /v1/ before any release exists.
          printf '{"latest": "%s"}\n' "${latest:-v1}" > dist/latest.json
          cat dist/latest.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    # Main only: pull requests build the site but never publish it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
