# Sway config written by deskwizard.
# Previous config (if any) is kept in ~/.config-backup/<timestamp>/.
# Reference: man 5 sway (Sway 1.10)
#
# Keybindings and startup programs come from the choices you made in the wizard.
# The cheat sheet printed after install lists them with plain-language labels.
# Values in the "Sway settings" step are written below as plain numbers and words.

# Modifier key: Mod4 is the Super/Windows key.
set $mod Mod4
# Terminal opened by $mod+Return.
set $term {{TERM_CMD}}
# The one lock command. The lock key, the idle timer and the power menu all use $lock.
set $lock swaylock -f -c 000000

# Windows. Title bars are off: each window has only a thin pixel border.
default_border pixel {{OPT:sway.border_width}}
default_floating_border pixel {{OPT:sway.border_width}}
# Gaps between and around tiled windows. "smart_gaps" removes the gaps when only one window is open.
gaps inner {{OPT:sway.gaps_inner}}
gaps outer {{OPT:sway.gaps_outer}}
smart_gaps {{OPT:sway.smart_gaps}}
# Moving the mouse over a window does not change focus unless this is on.
focus_follows_mouse {{OPT:sway.focus_follows_mouse}}
floating_modifier $mod normal

# Colors come from the chosen palette: border, background, text, indicator, child border.
client.focused          {{PAL:accent}} {{PAL:accent}} {{PAL:bg}} {{PAL:accent2}} {{PAL:accent}}
client.focused_inactive {{PAL:surface}} {{PAL:surface}} {{PAL:muted}} {{PAL:surface}} {{PAL:surface}}
client.unfocused        {{PAL:surface}} {{PAL:surface}} {{PAL:muted}} {{PAL:surface}} {{PAL:surface}}
client.urgent           {{PAL:error}} {{PAL:error}} {{PAL:bg}} {{PAL:error}} {{PAL:error}}

# Floating rules: dialogs, pop-ups and file pickers open floating and centered.
for_window [window_role="pop-up|dialog|bubble"] floating enable
# File pickers and other portal dialogs also open floating.
for_window [app_id="xdg-desktop-portal-(gtk|gnome|wlr)"] floating enable

# Input devices. Touchpad and keyboard settings from the "Sway settings" step.
input type:touchpad tap {{OPT:sway.touchpad_tap}}
input type:touchpad natural_scroll {{OPT:sway.natural_scroll}}
input type:keyboard xkb_layout {{OPT:sway.keyboard_layout}}
input type:keyboard repeat_delay {{OPT:sway.repeat_delay}}
input type:keyboard repeat_rate {{OPT:sway.repeat_rate}}

# Idle: lock after the chosen time, then turn the screen off. Any input wakes the screen.
exec swayidle -w timeout {{OPT:sway.lock_minutes}} '$lock' timeout {{OPT:sway.screen_off_minutes}} 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'

# Keybindings
{{BINDS}}

# Startup programs (portal, polkit agent, wallpaper, notifications)
{{EXEC}}

# Bar: when a bar is selected, Sway launches it instead of its built-in swaybar.
{{BAR_BLOCK}}
