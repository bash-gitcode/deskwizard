# Sway config written by deskwizard.
# Previous config (if any) is kept in ~/.config-backup/<timestamp>/.
# Reference: man 5 sway
#
# Keybindings and startup programs come from the choices you made in the wizard.
# The cheat sheet printed after install lists them with plain-language labels.

# Modifier key: Mod4 is the Super/Windows key.
set $mod Mod4
# Terminal opened by $mod+Return.
set $term {{TERM_CMD}}

# Windows
floating_modifier $mod normal
default_border pixel 2

# Keybindings
{{BINDS}}

# Startup programs (portal, polkit agent, wallpaper, notifications)
{{EXEC}}

# Bar: when a bar is selected, Sway launches it instead of its built-in swaybar.
{{BAR_BLOCK}}
