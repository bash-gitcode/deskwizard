# foot terminal config (deskwizard variant: roomy).
# Colors come from your palette; placeholders are filled in at build time.
[main]
font=$font_mono:size=13
pad=20x16

[cursor]
style=beam
blink=yes

[colors]
background=$bg_hex
foreground=$fg_hex
regular0=$surface_hex
regular1=$error_hex
regular2=$accent_hex
regular3=$warn_hex
regular4=$accent_hex
regular5=$accent2_hex
regular6=$accent_hex
regular7=$fg_hex
bright0=$muted_hex
bright1=$error_hex
bright2=$accent_hex
bright3=$warn_hex
bright4=$accent2_hex
bright5=$accent2_hex
bright6=$accent_hex
bright7=$fg_hex
selection-foreground=$bg_hex
selection-background=$accent_hex
