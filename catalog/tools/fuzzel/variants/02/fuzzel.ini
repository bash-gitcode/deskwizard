# fuzzel launcher config (deskwizard variant: compact).
# Colors come from your palette. Alpha ff = fully opaque.
[main]
font=$font_ui:size=11
width=30
lines=6
prompt=> 

[colors]
background=$bg_hexff
text=$fg_hexff
match=$accent_hexff
selection=$surface_hexff
selection-text=$fg_hexff
selection-match=$accent_hexff
border=$accent_hexff

[border]
width=1
radius=0
