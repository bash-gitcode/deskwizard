# fuzzel launcher config (deskwizard variant: large).
# Colors come from your palette. Alpha ff = fully opaque.
[main]
font=$font_ui:size=16
width=46
lines=8
prompt=> 

[colors]
background=$bg_hexff
text=$fg_hexff
match=$accent_hexff
selection=$surface_hexff
selection-text=$fg_hexff
selection-match=$accent_hexff
border=$accent_hexff

[border]
width=3
radius=8
