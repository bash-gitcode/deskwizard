<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Dusk: vertical gradient with a soft sun. Original drawing for deskwizard. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <radialGradient id="sun" cx="1900" cy="1000" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#sun)"/>
</svg>
