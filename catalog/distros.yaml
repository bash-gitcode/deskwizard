# Distros shown in wizard step 1. Only debian13 is available in Phase 1.
# support: verified-vm (installed in a VM by a maintainer), package-checked (every package and the first run are checked in CI), community (no checks).
# scripts/check-support.mjs fails if a claim is stronger than the CI jobs prove.
- id: debian13
  name: Debian 13 "trixie"
  status: available
  support: package-checked
  os_release:
    ID: debian
    VERSION_ID: "13"
- id: other
  name: Other distributions
  status: coming_soon
  support: community
