# Font choices shown in wizard step "Font". Nerd Fonts is not packaged in Debian,
# so the installer downloads the pinned release from github.com/ryanoasis/nerd-fonts.
# Each sha256 matches SHA-256.txt published with release v3.5.1 (checked in Phase 1.5).
#
# family: the font family name Waybar's style.css asks for ({{NERD_FONT}} placeholder).
# archive: null means no download; the font comes from apt (fallback_package).
version: v3.5.1
default: jetbrains-mono
dest_root: ~/.local/share/fonts/NerdFonts
fonts:
  - id: jetbrains-mono
    name: JetBrainsMono Nerd Font
    family: JetBrainsMono Nerd Font
    archive: JetBrainsMono.tar.xz
    sha256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf
    dest: JetBrainsMono
    fallback_package: fonts-font-awesome
  - id: fira-code
    name: FiraCode Nerd Font
    family: FiraCode Nerd Font
    archive: FiraCode.tar.xz
    sha256: 68e3bd6164864b8b514605bc34e3a87ac401c8c48682fcce6478c70263340207
    dest: FiraCode
    fallback_package: fonts-font-awesome
  - id: hack
    name: Hack Nerd Font
    family: Hack Nerd Font
    archive: Hack.tar.xz
    sha256: cdd389472e10e2261520140ff1b382b4f8a226af5fd0b2735b975d31151d9c3c
    dest: Hack
    fallback_package: fonts-font-awesome
  - id: font-awesome
    name: Font Awesome only (apt, no download)
    family: null
    archive: null
    sha256: null
    dest: null
    fallback_package: fonts-font-awesome
